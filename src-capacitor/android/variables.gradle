ext {
    // These values override the per-module defaults that every Capacitor 8
    // plugin declares (`project.hasProperty('compileSdkVersion') ? … : 36`),
    // so they must stay at or above the Capacitor 8 baseline — pinning them
    // lower silently drags every plugin module down with them.
    //
    // Google Play requires targetSdk 36 (Android 16) for updates published
    // after 31 Aug 2026. minSdk 24 is Capacitor 8's floor.
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxBiometricVersion = '1.1.0'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    playServicesVersion = '18.7.2'
}
