apply plugin: 'com.android.application'

android {
    namespace "org.capacitor.quasar.app"
    compileSdk rootProject.ext.compileSdkVersion
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    defaultConfig {
        applicationId "mybuho.buhogo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 26
        versionName "1.11.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // R8 on. Play grades every release on how much of its DEX is
            // shrunk and renamed ("DEX code optimisation"); an unminified
            // build scores ~1% obfuscation and gets flagged, with visibility
            // and publishing consequences after the stated deadline.
            //
            // Nothing that matters here is reached by name from Java alone:
            // the Capacitor bridge instantiates plugins and invokes their
            // methods reflectively from JavaScript. proguard-rules.pro keeps
            // exactly those surfaces - read it before touching this flag.
            //
            // Resource shrinking drops the unused resources the libraries
            // bring in (Play: "Resource shrinking isn't enabled"). The web
            // app lives in assets/, which it never touches. Resources looked
            // up only by name (the notification icon named from JavaScript)
            // are kept in res/raw/keep.xml - add any new ones there.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Material Components is not part of the app: nothing BuhoGO runs uses it.
// It only arrived as a declared dependency (@capgo/capacitor-native-biometric,
// whose code and layouts are plain AppCompat, and androidx navigation-ui,
// which that plugin never starts). Every Material release up to 1.14.0 still
// calls Window.setStatusBarColor / setNavigationBarColor (EdgeToEdgeUtils,
// the bottom/side sheet dialogs, the date picker), which Android 15
// deprecated and Play reports against this app. Excluding it removes those
// calls from the APK. proguard-rules.pro tells R8 about navigation-ui's
// unused references to it.
configurations.configureEach {
    exclude group: 'com.google.android.material', module: 'material'
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // App lock (AppLockPlugin) — biometric prompt with device-credential fallback
    implementation "androidx.biometric:biometric:$androidxBiometricVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.gms:play-services-base:$playServicesVersion"
    // Cloud backup — Google sign-in + on-demand Drive tokens (CloudBackupPlugin).
    // No google-services.json needed: the OAuth Android client is registered
    // server-side by package name + signing SHA-1.
    implementation "com.google.android.gms:play-services-auth:21.2.0"
    implementation project(':capacitor-android')
    implementation 'com.google.android.play:app-update:2.1.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
