apply plugin: 'com.android.application'

android {
    namespace "org.capacitor.quasar.app"
    compileSdk rootProject.ext.compileSdkVersion
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    defaultConfig {
        applicationId "mybuho.buhogo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 24
        versionName "1.9.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // R8 on. Play grades every release on how much of its DEX is
            // shrunk and renamed ("DEX code optimisation"); an unminified
            // build scores ~1% obfuscation and gets flagged, with visibility
            // and publishing consequences after the stated deadline.
            //
            // Nothing that matters here is reached by name from Java alone:
            // the Capacitor bridge instantiates plugins and invokes their
            // methods reflectively from JavaScript. proguard-rules.pro keeps
            // exactly those surfaces - read it before touching this flag.
            //
            // Resource shrinking stays off on purpose: the web app lives in
            // assets/ (which it never touches), so it would buy nothing here
            // while risking resources the GMS scanner UI loads dynamically.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // App lock (AppLockPlugin) — biometric prompt with device-credential fallback
    implementation "androidx.biometric:biometric:$androidxBiometricVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.gms:play-services-base:$playServicesVersion"
    // Pinned above what play-services-code-scanner drags in: Material's
    // bottom-sheet / side-sheet dialogs called Window.setStatusBarColor and
    // setNavigationBarColor unconditionally, which Android 15 deprecated and
    // Play reports against this app. 1.13.x goes edge-to-edge without them.
    // Nothing in BuhoGO's own UI is built on Material - this only raises the
    // version the scanner's dialogs resolve to.
    implementation "com.google.android.material:material:$materialVersion"
    // Cloud backup — Google sign-in + on-demand Drive tokens (CloudBackupPlugin).
    // No google-services.json needed: the OAuth Android client is registered
    // server-side by package name + signing SHA-1.
    implementation "com.google.android.gms:play-services-auth:21.2.0"
    implementation project(':capacitor-android')
    implementation 'com.google.android.play:app-update:2.1.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
