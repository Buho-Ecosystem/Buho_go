# Zapstore publish config (zsp schema) - https://zapstore.dev/docs/publish
# Publish with:  SIGN_WITH=<nsec|bunker> zsp publish zapstore.yaml
# The app id (mybuho.buhogo) and version (1.11.0) are read from the APK below.

# Source code repository (shown in the app store)
repository: https://github.com/Buho-Ecosystem/Buho_go

# Publisher identity (Buho account). The relay reads this file from the repository
# and only accepts releases signed with this key, so sign with exactly it.
pubkey: npub12p5c90ekq4w5mxt52hcm38p6wjjacm8ufq9axsskp0cttw5dmx5s0y335h

# Where to fetch the APK. A local path lets us ship the local icon and
# screenshots below. Bump this filename on each release.
release_source: ./output/BuhoGO_v1_11_0.apk

# Release notes: zsp takes this version's "## [x.y.z]" section.
release_notes: ./CHANGELOG.md

# ---------------------------------------------------------------------------
# App metadata
# ---------------------------------------------------------------------------
name: BuhoGO
summary: The friendly Bitcoin and Lightning wallet

description: |
  BuhoGO is a friendly, open-source Bitcoin and Lightning wallet. Hold your own keys, pay anyone, and spend anywhere, all from one clean app.

  Create self-custodial Spark wallets (up to six from one recovery phrase) or an Arkade wallet right inside BuhoGO, or bring the wallets you already use through Nostr Wallet Connect (NWC) or LNbits. Switch between them with a tap.

  ## What you can do
  - Pay Lightning invoices, Lightning addresses, LNURL, Spark addresses and Bitcoin addresses
  - Send to a Nostr profile, a NIP-05 name or a phone number
  - Choose which of your wallets pays, right on the payment sheet
  - Ask friends for money, split the bill and chat in private, end-to-end encrypted
  - Receive with one QR code that works for every kind of payment
  - Tap to pay with NFC and Bolt Cards
  - Run a shop with Kiosk mode: tips, round-up and card payments
  - Move money on its own with Auto-Transfer, in sats or your currency
  - Discover Bitcoin-friendly places on the built-in map
  - Buy eSIMs, VPNs and gift cards without leaving the app
  - Learn Bitcoin in short lessons and earn real sats
  - Export your history as PDF, CSV or XML
  - Dark and light theme, in English, German and Spanish

  ## Why BuhoGO?
  Most wallets lock you into one provider. BuhoGO works with the setup you already have, or lets you start fresh in minutes. It is built for clarity, speed and self-custody, without the jargon.

# SPDX license identifier (the repo ships the GNU AGPL v3)
license: AGPL-3.0-only

website: https://home.mybuho.de/buhogo

